[project]
name = "poker-preflop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim>=2.61",
    "pydantic-evals>=2.61",
    "claude-agent-sdk>=0.2.174",
    "logfire>=5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_preflop"]
